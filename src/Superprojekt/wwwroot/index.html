        <script>
        // The PWA service worker was removed; unregister any worker a previous
        // build installed so it stops intercepting fetches.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
                rs.forEach(function (r) { r.unregister(); });
            });
        }
        </script>
    </body>
